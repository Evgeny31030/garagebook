<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GarageBook | Add vehicle</title>
</head>
<body>
    <h1>Add a vehicle</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save vehicle</button>
    </form>

    <p><a href="{% url 'vehicle_list' %}">Back to vehicles</a></p>
</body>
</html>
